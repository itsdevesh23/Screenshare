server:
  port: 8080

spring:
  application:
    name: inspection-system
  datasource:
    url: jdbc:h2:mem:inspection_system
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        format_sql: true
    open-in-view: false
  h2:
    console:
      enabled: true

app:
  security:
    jwt-secret: "change-this-dev-secret-before-production"
    token-validity-minutes: 480
  cors:
    allowed-origins: "*"
